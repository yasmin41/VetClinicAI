name: vetclinicai

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped

    ports:
      - "${N8N_PORT:-5679}:5678"

    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Amman}
      TZ: ${TZ:-Asia/Amman}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
